<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 84" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .bold { font-weight: 700; }
      .muted { fill: #57606a; }
      .accent { fill: #0969da; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="858" height="82" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />

  <!-- Accent bar left border -->
  <rect x="1" y="1" width="6" height="82" rx="2" fill="#0969da" />

  <!-- Main Brand -->
  <text x="32" y="52" class="mono bold accent" font-size="34" letter-spacing="-0.5">0xThiagoAmaral</text>
  <text x="340" y="50" class="mono muted" font-size="22">/ research-system</text>
</svg>
