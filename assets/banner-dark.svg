<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 148" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
